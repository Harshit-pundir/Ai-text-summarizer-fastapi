<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Summarizer</title>
    <style>
      /* 🌍 Default (Light Mode) Variables */
      :root {
        --bg: #fff7ed;
        --card-bg: rgba(255, 255, 255, 0.7);
        --text: #1f2937;
        --subtext: #6b7280;
        --accent: #fb923c;
        --accent-dark: #f97316;
        --border: #e5e7eb;
        --output-bg: rgba(255, 237, 213, 0.8);
      }

      /* 🌙 Dark Mode Variables */
      body.dark {
        --bg: #0f172a;
        --card-bg: rgba(30, 41, 59, 0.7);
        --text: #e5e7eb;
        --subtext: #94a3b8;
        --accent: #fb923c;
        --accent-dark: #f97316;
        --border: #334155;
        --output-bg: rgba(51, 65, 85, 0.6);
      }

      /* ✅ FIX: Global box-sizing prevents overflow */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      /* 🌍 Base */
      body {
        font-family: "Inter", sans-serif;
        background: var(--bg);
        color: var(--text);
        margin: 0; /* ✅ FIX: Remove default body margin */
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
      }

      /* 📦 Container */
      .container {
        position: relative;
        width: 100%;
        max-width: 600px;
        margin: 10px;
        padding: 50px;
        border-radius: 16px;
        background: var(--card-bg);
        backdrop-filter: blur(12px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      }

      /* 🌙 Toggle Button */
      #theme-toggle {
        position: absolute;
        top: 15px;
        right: 15px;
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 50%;
        padding: 8px 10px;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      #theme-toggle:hover {
        background: var(--border);
      }

      /* 🧠 Headings */
      h1 {
        text-align: center;
        background: linear-gradient(90deg, var(--accent), var(--accent-dark));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      h3 {
        text-align: center;
        color: var(--subtext);
        margin-bottom: 25px;
      }

      /* 📝 Form */
      form {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      /* ✍️ Textarea — ✅ FIX: width uses 100% safely due to box-sizing */
      textarea {
        width: 100%;
        min-height: 160px;
        padding: 16px;
        font-size: 15px;
        font-family: inherit;
        line-height: 1.6;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.6);
        color: var(--text);
        resize: vertical;
        transition: all 0.25s ease;
      }

      textarea::placeholder {
        color: var(--subtext);
        opacity: 0.7;
      }

      textarea:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow:
          0 0 0 3px rgba(251, 146, 60, 0.2),
          0 4px 12px rgba(0, 0, 0, 0.08);
      }

      body.dark textarea {
        background: rgba(30, 41, 59, 0.6);
        color: var(--text);
      }

      body.dark textarea:focus {
        background: rgba(30, 41, 59, 0.9);
      }

      /* 🔘 Button */
      button {
        background: linear-gradient(135deg, var(--accent), var(--accent-dark));
        color: white;
        border: none;
        padding: 12px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.2s ease;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 12px rgba(249, 115, 22, 0.3);
      }

      button:active {
        transform: scale(0.98);
      }

      /* 📊 Output */
      #summary-output {
        margin-top: 20px;
        padding: 15px;
        border-radius: 10px;
        background: var(--output-bg);
        border: 1px solid var(--border);
        animation: fadeIn 0.3s ease;
      }

      /* ✨ Fade in */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* 📱 FIX: Mobile breakpoint — prevents overflow and tightens padding */
      @media (max-width: 640px) {
        body {
          align-items: flex-start; /* ✅ Prevents squishing on short viewports */
          padding: 20px 16px;
        }

        .container {
          padding: 30px 20px; /* ✅ Reduce padding so content fits */
          border-radius: 12px;
        }

        textarea {
          font-size: 14px; /* ✅ Prevent iOS auto-zoom (must be ≥ 16px or explicitly set) */
          font-size: 16px; /* ✅ Set to 16px to fully prevent iOS zoom */
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <button id="theme-toggle">🌙</button>
      <h1>Text Summarizer</h1>
      <h3>using HuggingFace Transformer</h3>
      <p>Write or Paste your content below for quick summarization.</p>

      <form id="summarization-form">
        <textarea
          id="dialogue-input"
          placeholder="Enter your content here..."
          required
        ></textarea>
        <button type="submit">Summarize</button>
      </form>

      <div id="summary-output">
        <h3 id="summary-heading">Content Summary</h3>
        <p id="summary-text"></p>
      </div>
    </div>

    <script>
      document
        .getElementById("summarization-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const dialogueInput = document.getElementById("dialogue-input");
          const summaryText = document.getElementById("summary-text");
          const submitButton = e.target.querySelector("button");

          const dialogue = dialogueInput.value.trim();
          if (!dialogue) return;

          summaryText.innerText = "Processing...";
          submitButton.disabled = true;

          try {
            const response = await fetch("/summarize/", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ dialogue }),
            });

            if (!response.ok) {
              throw new Error(`Server error: ${response.status}`);
            }

            const data = await response.json();
            summaryText.innerText = data.summary || "No summary returned.";
          } catch (err) {
            summaryText.innerText = `Error: ${err.message}`;
          } finally {
            submitButton.disabled = false;
          }
        });
      // 🌓 Dark Mode Toggle Logic
      const toggleBtn = document.getElementById("theme-toggle");

      // Load saved theme
      if (localStorage.getItem("theme") === "dark") {
        document.body.classList.add("dark");
        toggleBtn.textContent = "☀️";
      }

      // Toggle on click
      toggleBtn.addEventListener("click", () => {
        document.body.classList.toggle("dark");

        if (document.body.classList.contains("dark")) {
          localStorage.setItem("theme", "dark");
          toggleBtn.textContent = "☀️";
        } else {
          localStorage.setItem("theme", "light");
          toggleBtn.textContent = "🌙";
        }
      });
    </script>
  </body>
</html>
